{% extends "base.html" %}
{% block title %}Upload{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <h3 class="mb-3">Upload your notes (PDF)</h3>
    <form method="POST" enctype="multipart/form-data">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="mb-3">
        <input type="file" name="file" accept=".pdf" class="form-control" required>
      </div>
      <button type="submit" class="btn btn-primary w-100">Generate Summary, Flashcards & Quiz</button>
    </form>
    <p class="text-muted mt-2">Limited to 5 uploads per day.</p>
  </div>
</div>
{% endblock %}
