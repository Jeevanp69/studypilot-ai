services:
  - type: web
    name: studypilot-ai
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn "run:app"

    envVars:
      - key: PYTHON_VERSION
        value: 3.10

      - key: SECRET_KEY
        generateValue: true

      - key: GEMINI_API_KEY
        sync: false

      - key: DATABASE_URL
        fromDatabase:
          name: studypilot-db
          property: connectionString

      - key: RATELIMIT_STORAGE_URI
        value: memory://

databases:
  - name: studypilot-db
    plan: free